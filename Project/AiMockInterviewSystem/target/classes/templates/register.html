<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:420px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation:fadeIn 0.8s ease-in-out;
}

.register-icon{
    text-align:center;
    font-size:60px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
    font-size:32px;
}

input,
select{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
    transition:0.3s;
}

input:focus,
select:focus{
    border-color:#667eea;
    outline:none;
    box-shadow:0 0 10px rgba(102,126,234,0.3);
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(102,126,234,0.4);
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    text-decoration:none;
    color:#667eea;
    font-weight:bold;
}

.login-link a:hover{
    color:#764ba2;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="register-icon">
        👤
    </div>

    <h2>Create Account</h2>

    <form th:action="@{/saveUser}"
          method="post"
          th:object="${user}">

        <input type="text"
               th:field="*{name}"
               placeholder="Enter Full Name"
               required>

        <input type="email"
               th:field="*{email}"
               placeholder="Enter Email Address"
               required>

        <input type="password"
               th:field="*{password}"
               placeholder="Enter Password"
               required>

        <select th:field="*{role}">
            <option value="">Select Role</option>
            <option value="USER">USER</option>
            <option value="ADMIN">ADMIN</option>
        </select>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a th:href="@{/login}">
            Login Here
        </a>

    </div>

</div>

</body>

</html>
